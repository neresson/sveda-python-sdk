[project]
name = "sveda-python-sdk"
version = "0.1.2"
description = "Embed a Sveda AI agent from Python (Flask, Django, FastAPI). https://sveda.dev/docs/hosts/python"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "Neresson" },
]
keywords = ["sveda", "ai", "agent", "copilot", "sdk", "flask", "django", "fastapi"]
dependencies = [
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://sveda.dev/docs/hosts/python"
Documentation = "https://sveda.dev/docs/hosts/python"
Repository = "https://github.com/neresson/sveda-python-sdk"
Issues = "https://github.com/neresson/sveda-python-sdk/issues"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
