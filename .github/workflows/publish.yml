name: Publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  pypi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1

      - name: Trigger sveda SDK compatibility matrix
        if: ${{ secrets.SVEDA_REPO_DISPATCH_TOKEN != '' }}
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.SVEDA_REPO_DISPATCH_TOKEN }}
          repository: neresson/sveda
          event-type: sdk-release
          client-payload: '{"sdk":"python","version":"${{ github.ref_name }}"}'
